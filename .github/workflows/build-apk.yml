name: Build ZYVORA Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyvora-terminal-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success

      - name: Preflight source validation
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/zyvora/terminal/MainActivity.kt

          # Exactly one MainActivity source is allowed.
          count=$(find app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) | wc -l)
          test "$count" -eq 1

          # Android manifest description must be a resource reference, not raw text.
          if grep -Eq 'android:description="[^"]+"' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: android:description must not contain raw text.'
            exit 1
          fi

          # The real terminal dependency and JitPack repository must remain present.
          grep -Fq "com.termux.termux-app:terminal-view:0.118.0" app/build.gradle
          grep -Fq "https://jitpack.io" settings.gradle

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
