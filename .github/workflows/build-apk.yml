name: Build ZYVORA ULTRA Terminal (Termux Fork)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyvora-termux-fork-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ZYVORA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Clone upstream Termux source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/termux-app
          mkdir -p build
          git clone --depth 1 https://github.com/termux/termux-app.git build/termux-app
          cd build/termux-app
          echo "TERMUX_UPSTREAM_COMMIT=$(git rev-parse HEAD)" | tee "$GITHUB_STEP_SUMMARY"
          test -f LICENSE.md
          test -f app/build.gradle
          test -f termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java
          test -f terminal-view/build.gradle
          test -f terminal-emulator/build.gradle

      - name: Apply ZYVORA branding and package identity
        shell: bash
        run: |
          set -euo pipefail
          cd build/termux-app
          python3 - <<'PY'
          from pathlib import Path

          package = 'com.zyvora.ultra.terminal'
          app_name = 'ZYVORA ULTRA Terminal'

          p = Path('app/build.gradle')
          s = p.read_text()
          marker = '    defaultConfig {\n        minSdkVersion project.properties.minSdkVersion.toInteger()'
          replacement = '    defaultConfig {\n        applicationId "' + package + '"\n        minSdkVersion project.properties.minSdkVersion.toInteger()'
          if marker not in s:
              raise SystemExit('Termux app/build.gradle defaultConfig marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace('        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"', '        manifestPlaceholders.TERMUX_PACKAGE_NAME = "' + package + '"', 1)
          s = s.replace('        manifestPlaceholders.TERMUX_APP_NAME = "Termux"', '        manifestPlaceholders.TERMUX_APP_NAME = "' + app_name + '"', 1)
          p.write_text(s)

          p = Path('termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java')
          s = p.read_text()
          s = s.replace('public static final String TERMUX_APP_NAME = "Termux";', 'public static final String TERMUX_APP_NAME = "' + app_name + '";', 1)
          s = s.replace('public static final String TERMUX_PACKAGE_NAME = "com.termux";', 'public static final String TERMUX_PACKAGE_NAME = "' + package + '";', 1)
          p.write_text(s)

          for path in [Path('app/src/main/res/values/strings.xml'), Path('termux-shared/src/main/res/values/strings.xml')]:
              s = path.read_text().replace('"com.termux"', '"' + package + '"').replace('"Termux"', '"' + app_name + '"')
              path.write_text(s)

          p = Path('app/src/main/res/xml/shortcuts.xml')
          p.write_text(p.read_text().replace('com.termux', package))
          PY

          grep -Fq 'applicationId "com.zyvora.ultra.terminal"' app/build.gradle
          grep -Fq 'TERMUX_PACKAGE_NAME = "com.zyvora.ultra.terminal"' termux-shared/src/main/java/com/termux/shared/termux/TermuxConstants.java
          grep -Fq 'manifestPlaceholders.TERMUX_APP_NAME = "ZYVORA ULTRA Terminal"' app/build.gradle
          test -f LICENSE.md
          echo 'ZYVORA branding patch: PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build upstream Termux fork
        shell: bash
        run: |
          set -euo pipefail
          cd build/termux-app
          chmod +x gradlew
          TERMUX_PACKAGE_VARIANT=apt-android-7 TERMUX_APP_VERSION_NAME=0.118.3-zyvora ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd build/termux-app
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK=$APK"
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")"
          sha256sum "$APK"
          echo 'ZYVORA Termux fork APK integrity: PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload ZYVORA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-ULTRA-Terminal-Termux-Fork-debug
          path: build/termux-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload upstream license and fork source metadata
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Termux-Fork-Licensing
          path: |
            build/termux-app/LICENSE.md
            build/termux-app/README.md
          if-no-files-found: error
          retention-days: 90