name: Build ZYVORA Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyvora-terminal-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success

      - name: Preflight source validation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            settings.gradle
            build.gradle
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/zyvora/terminal/MainActivity.kt
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          mapfile -t activities < <(find app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print)
          if [ "${#activities[@]}" -ne 1 ] || [ "${activities[0]}" != "app/src/main/java/com/zyvora/terminal/MainActivity.kt" ]; then
            echo 'Exactly one MainActivity source is required:'
            printf '%s\n' "${activities[@]}"
            exit 1
          fi

          if find app/src/main -type f -name 'TerminalShell.kt' -print -quit | grep -q .; then
            echo 'Obsolete fake TerminalShell.kt detected; remove it.'
            exit 1
          fi

          grep -Fq 'com.termux.termux-app:terminal-view:0.118.0' app/build.gradle || {
            echo 'Missing terminal-view dependency'; exit 1;
          }

          grep -Fq 'https://jitpack.io' settings.gradle || {
            echo 'Missing JitPack repository'; exit 1;
          }

          if grep -Eq 'android:description="[^"]+"' app/src/main/AndroidManifest.xml; then
            echo 'Raw android:description detected; use a resource reference or omit it.'
            exit 1
          fi

          if grep -RIn --exclude-dir=build 'TODO.*FAIL\|FIXME.*FAIL' app/src/main 2>/dev/null; then
            echo 'Unresolved failure marker found in source.'
            exit 1
          fi

          echo 'Preflight validation: PASS'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo 'APK was not generated'; exit 1; }
          test "$(stat -c%s "$APK")" -gt 10000 || { echo 'APK is unexpectedly small'; exit 1; }
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          echo 'APK integrity check: PASS'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
