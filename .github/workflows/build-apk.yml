name: Build ZYVORA Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyvora-terminal-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success

      - name: Preflight source validation
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || { echo 'Missing settings.gradle'; exit 1; }
          test -f build.gradle || { echo 'Missing root build.gradle'; exit 1; }
          test -f app/build.gradle || { echo 'Missing app/build.gradle'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'Missing AndroidManifest.xml'; exit 1; }
          test -f app/src/main/java/com/zyvora/terminal/MainActivity.kt || { echo 'Missing MainActivity.kt'; exit 1; }
          test ! -f app/src/main/java/com/zyvora/terminal/MainActivity.java || { echo 'Duplicate MainActivity.java detected'; exit 1; }
          grep -Fq "com.termux.termux-app:terminal-view:0.118.0" app/build.gradle || { echo 'Missing terminal-view dependency'; exit 1; }
          grep -Fq "https://jitpack.io" settings.gradle || { echo 'Missing JitPack repository'; exit 1; }
          if grep -Eq 'android:description="[^"]+"' app/src/main/AndroidManifest.xml; then
            echo 'Raw android:description detected; use a resource reference or omit it.'
            exit 1
          fi
          echo 'Preflight validation: PASS'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo 'APK was not generated'; exit 1; }
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
          echo 'APK integrity check: PASS'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
