name: Build ZYVORA Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyvora-terminal-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success

      - name: Preflight source validation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            settings.gradle
            build.gradle
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/zyvora/terminal/MainActivity.kt
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          mapfile -t activities < <(find app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print)
          if [ "${#activities[@]}" -ne 1 ] || [ "${activities[0]}" != "app/src/main/java/com/zyvora/terminal/MainActivity.kt" ]; then
            echo 'Exactly one MainActivity source is required:'
            printf '%s\n' "${activities[@]}"
            exit 1
          fi
          if find app/src/main -type f -name 'TerminalShell.kt' -print -quit | grep -q .; then
            echo 'Obsolete fake TerminalShell.kt detected; remove it.'
            exit 1
          fi
          grep -Fq 'com.termux.termux-app:terminal-view:0.118.0' app/build.gradle || { echo 'Missing terminal-view dependency'; exit 1; }
          grep -Fq 'https://jitpack.io' settings.gradle || { echo 'Missing JitPack repository'; exit 1; }
          if grep -Eq 'android:description="[^"]+"' app/src/main/AndroidManifest.xml; then
            echo 'Raw android:description detected; use a resource reference or omit it.'
            exit 1
          fi
          echo 'Preflight validation: PASS'

      - name: Prepare Android native library directory
        shell: bash
        run: mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/userspace

      - name: Build embedded ARM64 Linux userspace
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$PWD/app/src/main/assets/userspace/zyvora-alpine-aarch64.tar.gz"
          WORK="$RUNNER_TEMP/zyvora-rootfs"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          docker pull --platform linux/arm64 alpine:3.24.3
          docker run --rm --platform linux/arm64 \
            -v "$WORK:/out" \
            alpine:3.24.3 sh -euxc '
              apk add --no-cache \
                bash \
                ca-certificates \
                curl \
                wget \
                git \
                openssh-client \
                python3 \
                py3-pip \
                nodejs \
                npm \
                nano \
                vim \
                tar \
                gzip \
                unzip \
                zip \
                file \
                procps \
                iproute2 \
                bind-tools
              mkdir -p /out/rootfs/root /out/rootfs/home /out/rootfs/tmp
              chmod 1777 /out/rootfs/tmp
              printf "%s\\n" "export HOME=/root" "export TERM=xterm-256color" "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" > /out/rootfs/root/.profile
              tar -C / -czf /out/rootfs.tar.gz \
                --exclude=./proc --exclude=./sys --exclude=./dev \
                --exclude=./out ./bin ./sbin ./usr ./lib ./etc ./root ./home ./tmp
            '

          test -s "$WORK/rootfs.tar.gz"
          cp "$WORK/rootfs.tar.gz" "$ROOTFS"
          SIZE=$(stat -c%s "$ROOTFS")
          echo "Embedded ARM64 userspace archive: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo 'Userspace archive is below the 20 MB safety floor; build aborted.'
            exit 1
          fi
          sha256sum "$ROOTFS"

      - name: Embed Android ARM64 PRoot runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/proot-me/proot-static-build/raw/master/static/proot-arm64' \
            -o app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          file app/src/main/jniLibs/arm64-v8a/libproot.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify debug APK and userspace payload
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ROOTFS="app/src/main/assets/userspace/zyvora-alpine-aarch64.tar.gz"
          test -s "$APK" || { echo 'APK was not generated'; exit 1; }
          test -s "$ROOTFS" || { echo 'Embedded userspace was not generated'; exit 1; }
          unzip -t "$APK" >/dev/null
          APK_SIZE=$(stat -c%s "$APK")
          ROOTFS_SIZE=$(stat -c%s "$ROOTFS")
          echo "APK_SIZE_BYTES=$APK_SIZE"
          echo "ROOTFS_SIZE_BYTES=$ROOTFS_SIZE"
          sha256sum "$APK"
          echo 'APK + Linux userspace integrity check: PASS'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Linux userspace bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-Terminal-linux-userspace-arm64
          path: app/src/main/assets/userspace/zyvora-alpine-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 90
