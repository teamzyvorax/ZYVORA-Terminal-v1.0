plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyvora.terminal'
    compileSdk 37

    defaultConfig {
        applicationId 'com.zyvora.terminal'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
